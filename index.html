<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07c160" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>透析记录</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      启动引导：清原生壳残留的 Service Worker + 白屏兜底，必须在入口脚本前同步执行。
      注意它必须是**外链**脚本：生产 CSP 不允许内联脚本（见 public/_headers），
      写回内联会被直接拦掉、兜底失效。逻辑与原因都在 public/boot.js 里。
    -->
    <script src="/boot.js"></script>

    <style>
      /* 启动占位样式必须内联：外链 CSS 到达前页面已经在渲染，否则还是白屏
         （CSP 的 style-src 保留了 'unsafe-inline'，这里不会被拦） */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f2f3f5;
      }
      #boot-splash {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #e8f7ef;
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #boot-splash .boot-logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #07c160;
        color: #fff;
        font-size: 28px;
        font-weight: 700;
        line-height: 56px;
        text-align: center;
      }
      #boot-splash .boot-tip {
        margin-top: 14px;
        color: #969799;
        font-size: 14px;
      }
      #boot-splash .boot-retry {
        margin-top: 16px;
        padding: 9px 22px;
        border: 0;
        border-radius: 999px;
        background: #07c160;
        color: #fff;
        font-size: 15px;
      }
      #boot-splash .boot-detail {
        max-width: 260px;
        margin-top: 12px;
        color: #c8c9cc;
        font-size: 11px;
        line-height: 1.5;
        text-align: center;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- 由 main.ts 在首次导航就绪后移除（见 src/main.ts） -->
    <div id="boot-splash">
      <div class="boot-logo">透</div>
      <div class="boot-tip">正在打开…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
