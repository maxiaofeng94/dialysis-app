<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07c160" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>透析记录</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      启动引导：必须同步跑在外链资源之前（ES5 语法，老 WebView 也要能解析）。

      ① 清掉原生壳里历史遗留的 Service Worker 与 Cache Storage。
         覆盖安装后 WebView 里还留着上一次的 SW，它用 NavigationRoute 返回**旧的
         index.html**；而旧 HTML 引用的旧 hash 资源会被新 SW 的 skipWaiting + 预缓存
         清理删掉 → 脚本 404 → 整页白屏。这是「打开经常一片空白」的头号原因。
         Web 端（Cloudflare Pages）靠 SW 做离线，所以只在原生壳里清。

      ② JS 起来之前给出可看的界面，失败时给一个「重新打开」按钮。
         以前 #app 是空的：脚本一旦加载失败，用户看到纯白，只能杀进程重开。
    -->
    <script>
      (function () {
        var mounted = false
        var failed = false
        var splash = null

        function splashEl() {
          if (!splash) splash = document.getElementById('boot-splash')
          return splash
        }

        function isNativeShell() {
          try {
            if (window.androidBridge) return true
            if (window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function') {
              return window.Capacitor.isNativePlatform() === true
            }
            // Capacitor 的 Android WebView 固定跑在 https://localhost 上
            return location.protocol === 'https:' && location.hostname === 'localhost'
          } catch (e) {
            return false
          }
        }

        if (isNativeShell()) {
          try {
            if (navigator.serviceWorker) {
              navigator.serviceWorker.getRegistrations().then(
                function (regs) {
                  for (var i = 0; i < regs.length; i++) regs[i].unregister()
                },
                function () {},
              )
            }
          } catch (e) {}
          // 等首屏该拿的资源都拿完再清缓存，别和自己的请求抢时间
          window.addEventListener('load', function () {
            try {
              if (!window.caches) return
              caches.keys().then(
                function (keys) {
                  for (var i = 0; i < keys.length; i++) caches['delete'](keys[i])
                },
                function () {},
              )
            } catch (e) {}
          })
        }

        function fail(detail) {
          var box = splashEl()
          if (failed || mounted || !box) return
          failed = true
          box.innerHTML =
            '<div class="boot-logo">透</div>' +
            '<div class="boot-tip">打开失败，请检查网络后重试</div>' +
            '<button type="button" class="boot-retry" id="boot-retry">重新打开</button>' +
            (detail ? '<div class="boot-detail">' + String(detail).slice(0, 120) + '</div>' : '')
          var btn = document.getElementById('boot-retry')
          if (btn) btn.onclick = function () { location.reload() }
        }

        // main.ts 挂载成功后回调，撤掉这里的超时兜底
        window.__bootMounted = function () { mounted = true }

        window.addEventListener(
          'error',
          function (e) {
            if (mounted || failed) return
            var t = e && e.target
            if (t && t !== window && t.tagName) {
              // 只认「页面根本跑不起来」的资源：脚本与样式表。
              // 图标之类的 404 不该把正常页面换成错误页。
              var tag = String(t.tagName).toUpperCase()
              if (tag !== 'SCRIPT' && !(tag === 'LINK' && /stylesheet/i.test(t.rel || ''))) return
              fail(tag.toLowerCase() + ' ' + (t.src || t.href || ''))
              return
            }
            fail(e && e.message)
          },
          true,
        )

        // 脚本压根没跑起来（SW 换掉了、解析失败）时，页面上至少还留一个出口
        window.setTimeout(function () {
          if (!mounted) fail('启动超时')
        }, 20000)
      })()
    </script>

    <style>
      /* 启动占位样式必须内联：外链 CSS 到达前页面已经在渲染，否则还是白屏 */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f2f3f5;
      }
      #boot-splash {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #e8f7ef;
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #boot-splash .boot-logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #07c160;
        color: #fff;
        font-size: 28px;
        font-weight: 700;
        line-height: 56px;
        text-align: center;
      }
      #boot-splash .boot-tip {
        margin-top: 14px;
        color: #969799;
        font-size: 14px;
      }
      #boot-splash .boot-retry {
        margin-top: 16px;
        padding: 9px 22px;
        border: 0;
        border-radius: 999px;
        background: #07c160;
        color: #fff;
        font-size: 15px;
      }
      #boot-splash .boot-detail {
        max-width: 260px;
        margin-top: 12px;
        color: #c8c9cc;
        font-size: 11px;
        line-height: 1.5;
        text-align: center;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- 由 main.ts 在首次导航就绪后移除（见 src/main.ts） -->
    <div id="boot-splash">
      <div class="boot-logo">透</div>
      <div class="boot-tip">正在打开…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
