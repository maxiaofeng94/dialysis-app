name: Test

# 可复用测试工作流（被 ci.yml / deploy*.yml / build-apk.yml 调用）
#
# 单独抽出来是为了「只定义一次门禁」：
#   · ci.yml            —— 每次 push / PR 都跑，作为日常质量门禁
#   · deploy.yml        —— 部署生产前必须先过（needs: test）
#   · deploy-admin.yml  —— 后台部署前必须先过
#   · build-apk.yml     —— 出 APK 前必须先过
# 这样「测试不通过就绝不会部署/出包」，而不是只发一条通知。
#
# 注意：本工作流必须自带完整环境（checkout + node + npm ci），
# 因为 reusable workflow 各自跑在独立的 runner 上。

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 1. 测试：单元 / 接口（Edge Function）/ 静态守卫 + 覆盖率阈值
  # ---------------------------------------------------------------
  tests:
    name: 测试与覆盖率
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 覆盖率阈值写在 vitest.config.ts 里，跌破阈值这一步会红
      #
      # 失败时把尾部输出转成 ::error:: 注解：GitHub 的完整日志需要登录才能看，
      # 而 check-run 的 annotations 通过 API 就能读到（公开仓库免 token），
      # 这样「CI 红了但看不到原因」的情况就不会再发生。
      - name: 运行全部测试
        run: |
          set +e
          npm run test:coverage > /tmp/test-output.txt 2>&1
          code=$?
          cat /tmp/test-output.txt
          echo "::notice::vitest exit=$code | 内存：$(free -m | awk 'NR==2{print $3"/"$2" MB used"}')"
          if [ $code -ne 0 ]; then
            # 每次只输出极少几行：GitHub 每个 check-run 最多 50 条注解，
            # 输出一多就会被截断，反而看不到关键信息。
            {
              echo "exit=$code"
              echo "Unhandled段: $(grep -n 'Unhandled' /tmp/test-output.txt | head -3 | tr '\n' ' ')"
              echo "Unhandled详情: $(sed -n "$(grep -n 'Unhandled Errors' /tmp/test-output.txt | head -1 | cut -d: -f1),+14p" /tmp/test-output.txt | tr '\n' '~' | cut -c1-900)"
              echo "TestFiles: $(grep -n 'Test Files' /tmp/test-output.txt | head -2 | tr '\n' ' ')"
              echo "Tests行: $(grep -n '^ *Tests ' /tmp/test-output.txt | head -2 | tr '\n' ' ')"
              echo "Duration: $(grep -n 'Duration' /tmp/test-output.txt | head -1 | tr '\n' ' ')"
              echo "覆盖率: $(grep -E 'All files' /tmp/test-output.txt | head -1)"
            } | sed 's/^/::error::/'
          fi
          exit $code

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # 2. 构建：类型检查（vue-tsc）+ App 产物 + 后台产物 + 后台冒烟
  #    与部署工作流同款步骤，确保「测试过 ≠ 能构建」这种坑提前暴露
  # ---------------------------------------------------------------
  build:
    name: 类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 App（vue-tsc 类型检查 + vite build）
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${VITE_SUPABASE_URL:-}" ]; then
            echo "::warning::未配置 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY，本次产物会退化为单机版（仅用于校验构建与类型）"
          fi
          npm run build

      - name: 构建后台管理端并校验入口文件
        run: |
          set -euo pipefail
          npm run build:admin
          # 产物必须是 dist-admin/index.html，否则 Pages 根路径 404
          test -f dist-admin/index.html || { echo "::error::dist-admin/index.html 不存在，检查 vite.admin.config.ts 的 root"; exit 1; }

      - name: 后台页面 SSR 冒烟
        run: npm run smoke:admin

      # ---------------------------------------------------------------
      # 生产库结构同步（第十二轮独立评审·中级-3）
      #
      # 为什么必须放进 CI：`npm run check:schema` 原来只挂在**本地 pre-push**，
      # 而 `git push --no-verify`、从网页/其它机器推、hook 没装（core.hooksPath
      # 是本地配置）都能绕过。第十一轮事故的本质就是「没有任何一环问过
      # 库和代码匹配吗」，只在开发机本地钩子里问，仍然不算有人问。
      #
      # 凭据用仓库 secret；没有 secret 的场景（fork PR）跳过并给出警告 ——
      # 宁可跳过也不能让 CI 因为「拿不到库」而红，那会训练大家忽略这道门。
      # ---------------------------------------------------------------
      - name: 生产库结构与 schema.sql 一致性
        env:
          PROD_URL: ${{ secrets.VITE_SUPABASE_URL }}
          PROD_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_URL:-}" ] || [ -z "${PROD_ANON:-}" ]; then
            echo "::warning::未配置 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY，跳过生产库结构检查"
            exit 0
          fi
          # ⚠️ 用 trap 保证无论 node 成功/失败都会删掉凭据文件 ——
          # 写成「node ... 然后 rm」时，node 失败会因 set -e 直接退出、rm 不执行，
          # 凭据就残留在工作区里（runner 是一次性的，但别的步骤可能读到它）。
          trap 'rm -f .env.production' EXIT
          # 脚本只认 .env.production（刻意不回退到 .env 的测试库）
          # 用 printf 而不是 echo：避免特殊字符被 shell 解释；
          # 命令本身只显示变量名（GitHub 会自动遮蔽 secret 的值）
          printf "VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n" "$PROD_URL" "$PROD_ANON" > .env.production
          node scripts/check-prod-schema.mjs
