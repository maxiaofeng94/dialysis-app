name: Deploy to Cloudflare Pages

# 推送 main 分支即自动构建并部署到 Cloudflare Pages
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   CLOUDFLARE_API_TOKEN   （Cloudflare API Token，权限：Account · Cloudflare Pages · Edit）
#   CLOUDFLARE_ACCOUNT_ID  （Cloudflare 账号 ID）
#   VITE_SUPABASE_URL       （生产库 Project URL）
#   VITE_SUPABASE_ANON_KEY  （生产库 anon public key）
# 未配置 Cloudflare 相关 secret 时会跳过部署步骤，不会让构建失败。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 发布前门禁：测试或构建不过，下面的 deploy 直接不执行（不会污染生产）
  test:
    name: 发布前门禁
    uses: ./.github/workflows/test.yml
    secrets: inherit

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::warning::未配置 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY，产物将退回本地单机模式"
          fi
          npm run build

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过部署"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 只做校验、不回显任何片段：本仓库是公开仓库，Actions 日志人人可看
          resp=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          if ! printf '%s' "$resp" | grep -q '"success":true'; then
            echo "::error::Cloudflare API Token 无效或已过期，请检查 secret CLOUDFLARE_API_TOKEN 的值（不要带引号）"
            exit 1
          fi
          echo "✅ Token 校验通过"
          acc=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts)
          if ! printf '%s' "$acc" | grep -q "$CLOUDFLARE_ACCOUNT_ID"; then
            echo "::error::该 Token 看不到 CLOUDFLARE_ACCOUNT_ID 对应的账号，请核对 secret 的值"
            exit 1
          fi
          echo "✅ 账号 ID 校验通过"
          echo "凭据自检通过 ✅"
        id: creds

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=dialysis --branch=main
