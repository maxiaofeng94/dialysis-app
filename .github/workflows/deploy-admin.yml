name: Deploy Admin Console to Cloudflare Pages

# 后台管理端独立部署：只构建 dist-admin（入口 admin/index.html + src/admin/**），
# 与 App 的 dist/ 完全分离，也不会随 cap sync 进 APK。
#
# 复用与 App 相同的仓库 secrets：
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY
# 首次运行会自动创建 Pages 项目 dialysis-admin（已存在则忽略报错）。

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'src/admin/**'
      - 'public/**' # 安全响应头 public/_headers 也在产物里，改它必须重部署后台
      - 'vite.admin.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.app.json'
      - 'tsconfig.node.json'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

jobs:
  # 发布前门禁：测试或构建不过，下面的 deploy 直接不执行
  test:
    name: 发布前门禁
    uses: ./.github/workflows/test.yml
    secrets: inherit

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build admin console
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::未配置 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY，后台将无法连接数据库"
            exit 1
          fi
          npm run build:admin
          # 产物必须是 dist-admin/index.html，否则 Pages 根路径会 404
          test -f dist-admin/index.html || { echo "::error::dist-admin/index.html 不存在，检查 vite.admin.config.ts 的 root"; exit 1; }

      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过部署"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 项目不存在时自动创建；已存在会报错，忽略即可
          npx --yes wrangler@4 pages project create dialysis-admin --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist-admin --project-name=dialysis-admin --branch=main
