name: Build APK

# 推送到 main 且改动影响 App 内容/Android 工程时，自动构建 APK 并滚动发布到 Release
# 手机固定下载直链：https://github.com/<owner>/<repo>/releases/download/latest/dialysis-recorder.apk
#
# 构建类型是 **release**（不是 debug）：debug 包 debuggable=true，
# 会让 Capacitor 打开 WebView 远程调试，拿到设备/开 adb 的人可直接接管页面、读登录态与病历缓存。
#
# 需要在仓库 Secrets 配置：
#   VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY  —— 构建 web 产物用（不配则 APK 退化为单机版，会直接失败）
#   ANDROID_DEBUG_KEYSTORE_BASE64               —— 本机 keystore 的 base64；debug 与 release **同源**，
#                                                  换掉它会让签名指纹变化，用户必须卸载重装（会丢 App 本地数据）

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "capacitor.config.json"
      - "android/app/**"
      - "android/build.gradle"
      - "android/settings.gradle"
      - "android/variables.gradle"
      - "android/gradle/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 发布 Release 必须；只读会 403

jobs:
  build:
    name: 构建并发布 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # AGP 8.2.1 需要 JDK 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android # 用 android/gradlew（Gradle 8.2.1，与本地一致）

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 web 产物（注入生产库配置）
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "::error title=缺少生产库配置::未配置 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY，构建出的 APK 会退化成单机版"
            exit 1
          fi
          npm run build

      - name: 同步 web 产物到 Android 工程
        run: npx cap sync android

      - name: 还原签名密钥
        env:
          KS_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/signing.keystore"
          if [ -z "${KS_B64:-}" ]; then
            echo "::error title=未配置签名密钥::未配置 ANDROID_DEBUG_KEYSTORE_BASE64，release 产物将未签名、无法安装"
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$KS"
          # 显式路径交给 Gradle（配合 android/app/build.gradle 的 signingConfigs.release / debug）。
          # debug 与 release 用同一份密钥材料 —— 换掉就等于换证书，用户必须卸载重装（会丢数据）。
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "DEBUG_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          mkdir -p ~/.android && cp "$KS" ~/.android/debug.keystore
          echo "证书指纹（应与本地一致）："
          keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey 2>/dev/null | grep -E "SHA256:" || true

      - name: 构建 release APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew # 保险：Windows 上提交时可能丢掉可执行位
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: 校验 APK
        working-directory: android
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          TOOL="$ANDROID_HOME/build-tools/$BT"
          "$TOOL/aapt2" dump badging "$APK" | grep -E "^package:|^application-label:" || true

          # ① 必须是真正的 release：debuggable=true 会让 adb / chrome://inspect 接管 WebView
          if "$TOOL/aapt2" dump xmltree --file AndroidManifest.xml "$APK" \
             | grep -q 'debuggable(0x0101000f)=(type 0x12)0x1'; then
            echo "::error title=产物是 debuggable::APK 带 android:debuggable=true，WebView 可被远程调试"
            exit 1
          fi
          echo "✅ debuggable 未开启（release 构建）"

          # ② 必须已签名，且证书指纹与本地一致（决定手机能否直接覆盖安装）
          if ! "$TOOL/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"; then
            echo "::error title=产物未签名::release APK 没有可用签名，无法安装"
            exit 1
          fi
          echo "✅ APK 已签名"

          # ③ 确认打进包里的 web 产物连的是生产库（而不是测试库或本地模式）
          REF=$(printf '%s' "$VITE_SUPABASE_URL" | sed -E 's|https?://||; s|\.supabase\.co.*||')
          TMP=$(mktemp -d)
          unzip -q "$APK" "assets/public/assets/*.js" -d "$TMP"
          if grep -rq "$REF" "$TMP"; then
            echo "✅ APK 内的 web 产物已连接生产库（$REF）"
          else
            echo "::error title=连错后端::APK 内的 web 产物没有注入生产库配置"
            exit 1
          fi
          rm -rf "$TMP"

      - name: 上传 Artifact（历史留档）
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Release（latest，滚动覆盖）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/$REPO"
          AUTH="Authorization: Bearer $GH_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          NAME="dialysis-recorder.apk"

          # 先删旧 tag 与旧 release：tag 不删，新 release 会指向旧提交
          curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" "$API/git/refs/tags/latest" >/dev/null 2>&1 || true
          OLD_ID=$(curl -sS -H "$AUTH" -H "$ACCEPT" "$API/releases/tags/latest" | jq -r '.id // empty' 2>/dev/null || true)
          if [ -n "${OLD_ID:-}" ]; then
            curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" "$API/releases/$OLD_ID" >/dev/null || true
          fi

          BODY=$(printf '自动构建产物\n\n- 提交：`%s`\n- 构建时间：%s\n' "$GITHUB_SHA" "$(date -u '+%Y-%m-%d %H:%M UTC')")
          REL=$(curl -sS -X POST -H "$AUTH" -H "$ACCEPT" \
            -d "$(jq -n --arg tag latest --arg name "最新构建 · ${GITHUB_SHA:0:7}" --arg body "$BODY" \
                  '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false}')" \
            "$API/releases")
          REL_ID=$(echo "$REL" | jq -r '.id // empty')
          if [ -z "${REL_ID:-}" ]; then
            echo "::error title=发布 Release 失败::$(echo "$REL" | jq -r '.message // "unknown"')"
            exit 1
          fi

          curl -sS -X POST -H "$AUTH" -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "https://uploads.github.com/repos/$REPO/releases/$REL_ID/assets?name=$NAME" \
            | jq -r '"已上传：" + (.name // "失败") + "  " + ((.size // 0) | tostring) + " bytes"'

          {
            echo "### 📱 APK 已发布"
            echo ""
            echo "- 下载页：https://github.com/$REPO/releases/latest"
            echo "- 手机直链：https://github.com/$REPO/releases/download/latest/$NAME"
          } >> "$GITHUB_STEP_SUMMARY"
