<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>需要更新系统组件 · 透析记录</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f2f3f5;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #07c160;
        color: #fff;
        font-size: 28px;
        font-weight: 700;
        line-height: 56px;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 17px;
        color: #323233;
      }
      p {
        margin: 6px 0;
        max-width: 320px;
        font-size: 14px;
        line-height: 1.7;
        color: #646566;
      }
      .muted {
        font-size: 12px;
        color: #969799;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">透</div>
      <h1>手机的系统组件太旧了</h1>
      <p>
        本应用需要「<b>Android System WebView</b>」（或 Chrome 浏览器）80 及以上版本才能打开。
      </p>
      <p>
        请打开手机的应用商店，搜索并更新「<b>Android System WebView</b>」与
        「<b>Chrome</b>」，然后重新打开本应用。
      </p>
      <p class="muted">
        部分手机在「设置 → 应用管理」里也能找到它。若一直无法更新，请联系家属帮忙处理。
      </p>
    </div>
  </body>
</html>
